name: Build Farida Adventures APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Run smoke tests
        run: node tests/smoke-test.cjs
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Farida-Adventures-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: مغامرات فريدة 2.2.0
          body: |
            إصدار تجريبي قابل للتثبيت من مغامرات فريدة.
            يعمل دون اتصال بالإنترنت. ابدأ الموسيقى بعد فتح اللعبة بلمسة.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
