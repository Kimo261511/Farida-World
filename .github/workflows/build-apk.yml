name: Build Farida Adventures APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Run gameplay tests
        run: node tests/smoke-test.cjs
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK and 100 MB limit
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $SIZE bytes"
          test "$SIZE" -lt 104857600
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Farida-Adventures-3.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: مغامرات فريدة 3.0.0 - الرحلة السحرية
          body: |
            مغامرة منصات عربية أصلية بثلاثة عوالم وخمس عشرة مرحلة.
            تعمل دون اتصال بالإنترنت، مع تحكم لمس ومؤثرات وموسيقى ومتجر أزياء وحفظ تلقائي.
            APK أقل من 100 ميجابايت.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true