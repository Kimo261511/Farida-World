name: Build Farida Adventures APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Run source and gameplay checks
        run: node tests/smoke-test.cjs
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK integrity and minimum content size
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          echo "Required minimum: 104857600 bytes (100 MiB)"
          test "$SIZE" -ge 104857600
          unzip -t "$APK"
          unzip -l "$APK" | tee apk-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Farida-Adventures-4.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: مغامرات فريدة 4.0.0
          body: |
            إصدار لا ينشر إلا بعد اجتياز اختبار سلامة APK وشرط الحجم الأدنى 100 MiB.
            راجع GAME_DESIGN.md لمعرفة المحتوى ومعايير القبول.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true