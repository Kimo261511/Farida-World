<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171b48"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>عالم فريدة | Farida World</title>
<style>
:root{--ink:#20234f;--pink:#ff6fae;--gold:#ffd66b;--glass:#ffffffdf}
*{box-sizing:border-box}body{margin:0;background:#111638;color:white;font-family:system-ui,Tahoma,Arial;overflow:hidden;touch-action:manipulation}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#75d8ef 0%,#b5eff0 48%,#62c88a 49%,#238b78 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;top:12px;right:12px;left:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.pill{background:#17204dcc;border:2px solid #ffffff65;border-radius:22px;padding:8px 14px;font-weight:800;box-shadow:0 5px 18px #18205035}
button{font:inherit;border:0;cursor:pointer;color:#25234e;font-weight:900;border-radius:18px;padding:12px 18px;background:linear-gradient(#fff4c9,#ffc95e);box-shadow:0 5px 0 #d58b36,0 9px 20px #18205035}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #d58b36}
.panel{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:18px;background:#11163855;backdrop-filter:blur(5px)}
.card{width:min(560px,94vw);max-height:90dvh;overflow:auto;text-align:center;color:var(--ink);padding:24px;border:4px solid white;border-radius:30px;background:linear-gradient(145deg,#fff,#fff0f6);box-shadow:0 20px 70px #11163870}
.cover{display:block;width:min(190px,48vw);aspect-ratio:1;object-fit:cover;border-radius:34px;margin:0 auto 10px;border:5px solid white;box-shadow:0 12px 28px #6b4c8b55}h1{font-size:clamp(32px,7vw,56px);margin:4px 0;color:#ed559a;text-shadow:0 3px #ffd3e7}p{line-height:1.8}.sub{font-weight:700;color:#68709d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.world{min-height:104px;border:3px solid white;border-radius:22px;background:linear-gradient(145deg,#d9faff,#b8e8ff);box-shadow:0 5px 0 #8ebbd9;padding:12px;color:#25234e}.world b{display:block;font-size:19px}.world span{font-size:30px}
#controls{position:absolute;z-index:3;bottom:20px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}.ctrl{width:64px;height:64px;border-radius:50%;padding:0;font-size:26px;background:linear-gradient(#fff,#dceaff);box-shadow:0 5px 0 #9db5d7}
.action{width:76px;height:76px;border-radius:50%;font-size:24px;background:linear-gradient(#fff2b7,#ffb84d);box-shadow:0 6px 0 #c87a32}
#toast{position:absolute;z-index:5;top:80px;left:50%;transform:translateX(-50%);background:#17204de8;border-radius:20px;padding:10px 18px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.hidden{display:none!important}
@media(max-height:560px){.card{padding:12px}.grid{gap:7px;margin-top:8px}.world{min-height:75px}.ctrl{width:52px;height:52px}.action{width:62px;height:62px}}
</style></head>
<body><main id="game"><canvas id="scene"></canvas>
<div class="hud"><div class="pill">🌸 فريدة</div><div class="pill">💎 <span id="gems">0</span></div><div class="pill">⭐ <span id="stars">0</span></div><button id="home" aria-label="القائمة">⌂</button><button id="sound" aria-label="الصوت">🔊</button></div>
<div id="toast"></div>
<div id="menu" class="panel"><section class="card"><img class="cover" src="assets/farida-cover.svg" alt="غلاف عالم فريدة"><h1>عالم فريدة</h1><p class="sub">رحلة سحرية مليئة بالاكتشاف والمرح!</p><p>ساعدي فريدة في استكشاف العوالم، وجمع النجوم والبلورات، وفتح أسرار جديدة.</p><button id="play">ابدئي المغامرة ▶</button><div class="grid">
<button class="world" data-world="forest"><span>🌳</span><b>الغابة السحرية</b><small>مغامرة وجمع النجوم</small></button>
<button class="world" data-world="sea"><span>🐠</span><b>مملكة البحار</b><small>صيد السمك والكنوز</small></button>
<button class="world" data-world="desert"><span>🏜️</span><b>وادي الرمال</b><small>قفز وتحديات</small></button>
<button class="world" data-world="sky"><span>☁️</span><b>جزر السحاب</b><small>منصات وبلورات</small></button>
</div></section></div>
<div id="controls" class="hidden"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="action" id="jump">⬆</button></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),menu=document.querySelector('#menu'),controls=document.querySelector('#controls'),gemsEl=document.querySelector('#gems'),starsEl=document.querySelector('#stars'),toastEl=document.querySelector('#toast');
let W=0,H=0,dpr=1,mode='menu',world='forest',gems=Number(localStorage.fwGems||0),stars=Number(localStorage.fwStars||0),muted=false,audio=null,last=0,t=0,keys={left:false,right:false},player={x:100,y:0,vx:0,vy:0,ground:false,face:1,walk:0},cameraX=0,worldLength=0,items=[],particles=[],fish=[],score=0,timeLeft=60;
gemsEl.textContent=gems;starsEl.textContent=stars;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player.y===0)player.y=H*.7}
addEventListener('resize',resize);resize();
function sound(f=440,d=.12,type='sine'){if(muted)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function notify(s){toastEl.textContent=s;toastEl.style.opacity=1;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastEl.style.opacity=0,1500)}
function groundY(){return H*.78}
function start(w='forest'){world=w;mode=w==='sea'?'fish':'run';menu.classList.add('hidden');controls.classList.remove('hidden');score=0;timeLeft=60;player.x=W*.18;player.y=groundY()-58;player.vx=player.vy=0;cameraX=0;worldLength=Math.max(W*3.5,2200);items=[];particles=[];for(let i=0;i<18;i++)items.push({x:W*.48+i*(worldLength/19),y:groundY()-35-Math.random()*105,got:false,kind:i%3?'star':'gem'});fish=[];for(let i=0;i<12;i++)fish.push({x:Math.random()*W,y:H*.25+Math.random()*H*.48,v:.6+Math.random()*1.4,s:12+Math.random()*12});last=performance.now();sound(660,.2)}
document.querySelector('#play').onclick=()=>start('forest');document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>start(b.dataset.world));
document.querySelector('#home').onclick=()=>{mode='menu';menu.classList.remove('hidden');controls.classList.add('hidden');keys.left=keys.right=false;};
document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'🔇':'🔊';if(!muted)sound()};
function bind(id,k){let b=document.querySelector('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}
bind('left','left');bind('right','right');document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='run'&&player.ground){player.vy=-H*.62;player.ground=false;sound(520,.1)}});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if((e.key===' '||e.key==='ArrowUp')&&mode==='run'&&player.ground){player.vy=-H*.62;player.ground=false;sound(520,.1)}});addEventListener('keyup',e=>{if(['ArrowLeft','a'].includes(e.key))keys.left=false;if(['ArrowRight','d'].includes(e.key))keys.right=false});
canvas.addEventListener('pointerdown',e=>{if(mode==='fish'){let f=fish.find(q=>Math.hypot(q.x-e.clientX,q.y-e.clientY)<q.s+22);if(f){f.x=-100;gems+=2;score++;gemsEl.textContent=gems;localStorage.fwGems=gems;sound(880,.13);notify('أحسنتِ! +2 بلورة 💎');if(score>=10){stars++;starsEl.textContent=stars;localStorage.fwStars=stars;mode='menu';menu.classList.remove('hidden');controls.classList.add('hidden');notify('فزتِ في تحدي الصيد! نجمة جديدة ⭐')}}}});
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function background(){let sky=ctx.createLinearGradient(0,0,0,H);if(world==='sea'){sky.addColorStop(0,'#3b9fe0');sky.addColorStop(1,'#07517f')}else if(world==='desert'){sky.addColorStop(0,'#ffcf83');sky.addColorStop(1,'#f18b59')}else if(world==='sky'){sky.addColorStop(0,'#5b7fe6');sky.addColorStop(1,'#d5c5ff')}else{sky.addColorStop(0,'#68d5ed');sky.addColorStop(1,'#d8f6ce')}ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
if(world==='sea'){for(let i=0;i<7;i++){ctx.fillStyle='#ffffff18';ctx.beginPath();ctx.ellipse((i*177-t*18)%(W+180),H*.2+i*48,100,18,0,0,7);ctx.fill()}}
else{ctx.fillStyle=world==='desert'?'#d98b54':'#319b76';ctx.beginPath();ctx.moveTo(0,H*.72);for(let x=0;x<=W+40;x+=40)ctx.lineTo(x,H*.66+Math.sin(x*.012+t*.0004)*25);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();for(let i=0;i<8;i++){let x=(i*173-t*.025)%(W+100);ctx.fillStyle=world==='desert'?'#a65e48':'#176c58';ctx.beginPath();ctx.arc(x,H*.7,35+(i%3)*10,Math.PI,0);ctx.fill()}}
}
function drawFarida(){let x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);ctx.fillStyle='#422b51';ctx.beginPath();ctx.ellipse(0,26,19,27,0,0,7);ctx.fill();ctx.fillStyle='#f6c5a4';ctx.beginPath();ctx.arc(0,-5,19,0,7);ctx.fill();ctx.fillStyle='#56304d';ctx.beginPath();ctx.arc(0,-12,21,Math.PI,0);ctx.lineTo(19,0);ctx.quadraticCurveTo(12,-7,8,-18);ctx.quadraticCurveTo(-4,-25,-19,-8);ctx.fill();ctx.fillStyle='#30274b';ctx.beginPath();ctx.arc(7,-5,2.4,0,7);ctx.arc(-7,-5,2.4,0,7);ctx.fill();ctx.strokeStyle='#b94d70';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,2,5,.2,2.8);ctx.stroke();ctx.fillStyle='#ed5e9d';ctx.beginPath();ctx.moveTo(-16,18);ctx.lineTo(16,18);ctx.lineTo(22,48);ctx.lineTo(-22,48);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,18,5,0,7);ctx.arc(14,18,5,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);background();if(mode==='run'){let gy=groundY();ctx.fillStyle='#247b59';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#48b87a';ctx.fillRect(0,gy,W,9);items.forEach(it=>{if(it.got)return;ctx.save();ctx.translate(it.x-cameraX,it.y);ctx.rotate(t*.002);ctx.fillStyle=it.kind==='gem'?'#64f4f0':'#ffe36d';ctx.beginPath();if(it.kind==='gem'){ctx.moveTo(0,-15);ctx.lineTo(12,0);ctx.lineTo(0,15);ctx.lineTo(-12,0)}else{for(let i=0;i<10;i++){let a=i*Math.PI/5,r=i%2?6:15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}}ctx.closePath();ctx.fill();ctx.restore()});ctx.save();ctx.translate(-cameraX,0);drawFarida();ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('اجمعي النجوم والبلورات!',W/2-65, H*.16)}
else if(mode==='fish'){ctx.fillStyle='#0a5279';ctx.fillRect(0,H*.82,W,H*.18);fish.forEach(f=>{if(f.x< -50)return;ctx.save();ctx.translate(f.x,f.y);ctx.scale(Math.sin(t*.002+f.x)*.15+1,1);ctx.fillStyle=['#ffb84e','#ff6fae','#6fe5db','#b49cff'][Math.floor(f.s)%4];ctx.beginPath();ctx.ellipse(0,0,f.s*1.4,f.s,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-f.s,0);ctx.lineTo(-f.s*2,-f.s);ctx.lineTo(-f.s*2,f.s);ctx.fill();ctx.fillStyle='#14264a';ctx.beginPath();ctx.arc(f.s*.7,-3,2.5,0,7);ctx.fill();ctx.restore()});ctx.fillStyle='white';ctx.font='bold 20px system-ui';ctx.fillText('المسي الأسماك لاصطيادها! '+score+'/10  •  '+Math.ceil(timeLeft)+' ث',W/2-125,H*.16)}
requestAnimationFrame(draw)}
function update(dt){if(paused)return;t+=dt;if(mode==='run'){player.vx=(keys.right?1:0)-(keys.left?1:0);if(player.vx)player.face=Math.sign(player.vx);player.x=Math.max(25,Math.min(worldLength-25,player.x+player.vx*dt*.32));cameraX=Math.max(0,Math.min(worldLength-W,player.x-W*.38));player.vy+=dt*.0018;player.y+=player.vy*dt*.06;if(player.y>=groundY()-58){player.y=groundY()-58;player.vy=0;player.ground=true}items.forEach(it=>{if(!it.got&&Math.hypot(it.x-player.x,it.y-(player.y+20))<42){it.got=true;if(it.kind==='gem'){gems+=1;gemsEl.textContent=gems;localStorage.fwGems=gems;sound(990,.12)}else{stars++;starsEl.textContent=stars;localStorage.fwStars=stars;sound(760,.15)}score++;if(items.every(q=>q.got)){notify('رائع! أكملتِ العالم ⭐');stars+=2;starsEl.textContent=stars;localStorage.fwStars=stars;mode='menu';menu.classList.remove('hidden');controls.classList.add('hidden')}}})}else if(mode==='fish'){fish.forEach(f=>{f.x-=f.v*dt*.06;if(f.x< -45)f.x=W+45});timeLeft-=dt/1000;if(timeLeft<=0){timeLeft=60;mode='menu';menu.classList.remove('hidden');controls.classList.add('hidden');keys.left=keys.right=false;notify('انتهى وقت الجولة! رصيدك محفوظ، اختاري عالمًا جديدًا')}}}
function loop(now){let dt=Math.min(40,now-last);last=now;update(dt);requestAnimationFrame(loop)}
draw();requestAnimationFrame(loop);
if('serviceWorker' in navigator && location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script></body></html>
