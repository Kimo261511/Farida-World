<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#08172e;font-family:system-ui,Tahoma,sans-serif;touch-action:none}#stage{position:fixed;inset:0;height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse,#294c78,#07152b 75%)}#game{position:relative;width:min(100vw,177.78dvh);aspect-ratio:16/9;overflow:hidden;box-shadow:0 0 60px #0009}canvas{width:100%;height:100%;display:block}#hud{position:absolute;inset:0;pointer-events:none;color:white}#bar{display:none;position:absolute;top:2%;left:2%;right:2%;justify-content:space-between;align-items:center}.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.pill,.stat{background:#091b3dcc;border:1px solid #ffffff44;border-radius:30px;padding:7px 13px;font-size:clamp(10px,1.4vw,16px);font-weight:900}.hudbtn{pointer-events:auto;border:1px solid #fff7;border-radius:50%;width:42px;height:42px;background:#10264dcc;color:white;font-size:20px}#pad{display:none;position:absolute;bottom:3%;left:3%;right:3%;justify-content:space-between;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.ctrl{width:clamp(48px,7.5vw,78px);height:clamp(48px,7.5vw,78px);border:2px solid #ffffff99;border-radius:22px;background:linear-gradient(145deg,#ffffff55,#10264bcc);color:white;font-size:30px;font-weight:900;touch-action:none}.gold{background:linear-gradient(#ffe99a,#f3ad40)!important;color:#533510!important}.pink{background:linear-gradient(#ffc1dc,#e85d91)!important}#overlay{position:absolute;inset:0;display:grid;touch-action:none;overscroll-behavior:contain;place-items:center;padding:3%;background:#07172f88;backdrop-filter:blur(5px);color:white}#overlay.off{display:none}.card{width:min(660px,95%);max-height:94%;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;text-align:center;padding:clamp(15px,3vw,29px);border-radius:26px;border:1px solid #ffffff55;background:linear-gradient(145deg,#204575f5,#102447f5);box-shadow:0 20px 70px #0009}.logo{font-size:clamp(40px,7vw,70px);line-height:1}h1{font-size:clamp(23px,4vw,42px);margin:8px 0}.sub{color:#c6def8;font-size:clamp(11px,1.5vw,16px);margin:5px 0 17px}.story{font-size:clamp(13px,1.8vw,18px);line-height:1.8;color:#f4f7ff}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:15px}.btn{border:0;border-radius:15px;padding:11px 18px;min-width:105px;font:900 clamp(12px,1.6vw,17px) system-ui;color:#193253;background:linear-gradient(#ffedac,#ffbd48);box-shadow:0 5px #a66a2c;cursor:pointer}.green{background:linear-gradient(#bdffdf,#53d5a0)!important;box-shadow:0 5px #258866!important}.dark{background:#29496f!important;color:white!important;box-shadow:0 5px #0b1c36!important}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:480px;margin:13px auto}.lv{border:1px solid #fff5;border-radius:12px;padding:10px 3px;background:#294c76;color:white;font-weight:900}.lv.open{background:linear-gradient(#ffebaa,#e6a542);color:#543717}.lv.done{background:linear-gradient(#a8f7ca,#49ba8d);color:#12412f}.lv:disabled{opacity:.4}.stat{padding:9px 12px;background:#ffffff15;border-radius:13px}@media(orientation:portrait){#game{width:100vw;max-height:56.25vw;position:absolute;transform:rotate(90deg)}}
</style></head><body><div id="stage"><main id="game"><canvas id="cv" width="1280" height="720"></canvas><audio id="bgm" preload="auto" loop></audio><div id="hud"><div id="bar"><div class="row"><span class="pill">💎 <b id="gems">0</b></span><span class="pill">❤️ <b id="lives">3</b></span><span class="pill">⭐ <b id="score">0</b></span></div><div class="row"><span class="pill" id="worldName"></span><button class="hudbtn" id="pause">Ⅱ</button></div></div><div id="pad"><div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="group"><button class="ctrl pink" id="hit">✦</button><button class="ctrl gold" id="jump">⬆</button></div></div></div><div id="overlay"><div class="card" id="panel"></div></div></main></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('cv'),c=cv.getContext('2d'),W=1280,H=720,$=id=>document.getElementById(id);
const db={get(k,d){try{return JSON.parse(localStorage.getItem('farida3_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('farida3_'+k,JSON.stringify(v))}catch(e){}}};
let unlocked=Math.max(15,db.get('unlocked',1)),gems=db.get('gems',0),stars=db.get('stars',0),records=db.get('records',{}),owned=db.get('owned',[0]),skin=db.get('skin',0),sound=db.get('sound',true),music=db.get('music',true),mode='home',level=1,p=null,cam=0,plats=[],coins=[],foes=[],traps=[],bits=[],gate=null,checkpoint=0,earned=0,deaths=0,keys={},touch={l:false,r:false,j:false,a:false},audio=null,musicTimer=null,step=0,last=0,raf=0;
const worlds=[['الغابة المضيئة','#59bfd2','#c2edcf','#357d68','#3a7d54'],['مملكة الرمال','#e99c62','#ffe6a6','#b47c58','#a96d42'],['جزر النجوم','#394b9c','#b7a2e9','#6667a9','#51519c']];
const patterns=[[[0,570,300],[360,500,190],[620,425,190],[900,510,180],[1160,440,180],[1450,540,300]],[[0,570,240],[300,490,170],[550,420,170],[800,500,190],[1090,410,180],[1380,530,330]],[[0,570,250],[310,500,150],[540,430,150],[770,360,160],[1020,460,170],[1320,550,330]],[[0,570,270],[350,480,160],[610,400,180],[890,480,160],[1140,390,170],[1430,540,330]],[[0,570,240],[310,500,150],[550,430,150],[810,360,150],[1070,450,150],[1340,530,330]]];
const clothes=[['الزي الوردي','🌸',0],['زي المغامرة','🧢',30],['زي النجمة','👑',65],['زي البحر','🧜‍♀️',100]];
function persist(){[['unlocked',unlocked],['gems',gems],['stars',stars],['records',records],['owned',owned],['skin',skin],['sound',sound],['music',music]].forEach(x=>db.set(x[0],x[1]))}
function show(s){$('panel').innerHTML=s;$('overlay').classList.remove('off')}function hide(){$('overlay').classList.add('off')}
function world(){return worlds[Math.floor((level-1)/5)]}
let musicStep=0,musicGain=null,sfxGain=null;
const scales=[[523.25,587.33,659.25,783.99,880,1046.5],[392,440,493.88,587.33,659.25,783.99],[440,523.25,587.33,659.25,783.99,880]];
function audioOn(){if(!audio){let A=window.AudioContext||window.webkitAudioContext;if(A){audio=new A();musicGain=audio.createGain();musicGain.gain.value=.22;musicGain.connect(audio.destination);sfxGain=audio.createGain();sfxGain.gain.value=.65;sfxGain.connect(audio.destination)}}if(audio&&audio.state==='suspended')audio.resume();if(music){let bgm=$('bgm'),track=level<=5?'forest_theme.wav':level<=10?'desert_theme.wav':'star_islands_theme.wav',src='audio/'+track;if(!bgm.src.endsWith(src)){bgm.src=src;bgm.load()}bgm.volume=.38;let player=bgm;player.play().catch(()=>{})}}
function note(freq,dur,wave='sine',vol=.04,when=0,out=sfxGain){if(!audio||!out)return;let t=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type=wave;o.frequency.setValueAtTime(freq,t);filter.type='lowpass';filter.frequency.value=wave==='sawtooth'?1800:4200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(filter);filter.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.04)}
function playMusicStep(){if(!audio||!music||mode==='pause'||mode==='home'||mode==='map'||mode==='settings'||mode==='shop'||mode==='learnmenu')return;let scale=scales[Math.floor((level-1)/5)],step=musicStep++,root=scale[(step*2+(step%8===0?1:0))%scale.length];note(root/2,1.05,'triangle',.022,0,musicGain);if(step%4===0){note(root,0.72,'sine',.026,0,musicGain);note(root*1.25,.62,'sine',.012,.03,musicGain)}else if(step%2===0)note(root*2,.24,'triangle',.009,0,musicGain);if(step%8===7)note(scale[(step+3)%scale.length]*2,.35,'sine',.012,.04,musicGain)}
function tone(f,d,v){note(f,d,'sine',v||.04);note(f*2.01,d*.55,'triangle',(v||.04)*.22,.008)}
function noiseHit(dur,vol,filterHz){if(!audio||!sfxGain)return;let n=Math.floor(audio.sampleRate*dur),buf=audio.createBuffer(1,n,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);let src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=filterHz;g.gain.value=vol;src.connect(f);f.connect(g);g.connect(sfxGain);src.start()}
function fx(k){audioOn();if(!sound)return;if(k==='jump'){note(390,.11,'triangle',.045);note(590,.16,'sine',.035,.06);noiseHit(.07,.018,1500)}else if(k==='coin'){[784,988,1175].forEach((f,i)=>note(f,.19,'sine',.04,i*.055));note(1568,.12,'triangle',.018,.11)}else if(k==='hurt'){note(190,.24,'sawtooth',.035);note(125,.3,'triangle',.035,.06);noiseHit(.13,.035,500)}else if(k==='attack'){noiseHit(.12,.055,2200);note(260,.13,'sawtooth',.025);note(520,.09,'triangle',.018,.035)}else if(k==='win'){[523,659,784,1047,1318].forEach((f,i)=>{note(f,.42,'sine',.045,i*.12);note(f*1.5,.25,'triangle',.012,i*.12)})}}
function make(n){level=n;let a=patterns[(n-1)%5];plats=a.map(q=>({x:q[0],y:q[1],w:q[2],h:24}));let end=a[5][0]+a[5][2]-25;coins=[];foes=[];traps=[];bits=[];earned=0;deaths=0;cam=0;checkpoint=0;for(let i=0;i<16+((n-1)%5)*2;i++){let x=180+i*(end-300)/(15+((n-1)%5)*2),q=a.find(z=>x>=z[0]&&x<=z[0]+z[2])||a[1];coins.push({x,y:q[1]-85-(i%3)*12,phase:Math.random()*6,got:false})}for(let i=0;i<4+(n-1)%5;i++){let q=a[1+i%4];traps.push({x:q[0]+q[2]*.52,y:q[1]-18,w:34,h:18})}for(let i=0;i<3;i++){let q=a[i+1];foes.push({x:q[0]+q[2]*.5,y:q[1]-34,min:q[0]+5,max:q[0]+q[2]-40,v:i%2?1.1:-1.1,alive:true})}gate={x:end-55,y:a[5][1]-105,w:60,h:105};p={x:55,y:470,vx:0,vy:0,w:42,h:60,ground:false,face:1,life:3,inv:0,attack:0,anim:0};$('gems').textContent=gems;$('lives').textContent=3;$('score').textContent=0;$('worldName').textContent=world()[0]+' · '+n}
function home(){mode='home';$('bar').style.display='none';$('pad').style.display='none';background(0);drawGirl(850,430,1,0);show('<div class="logo">🌸✨</div><h1>مغامرات فريدة</h1><p class="sub">الرحلة السحرية · لعبة منصات ومغامرة</p><p class="story">انطلق مع فريدة في ثلاثة عوالم ساحرة، واجمع البلورات، وتغلّب على الحراس، وافتح بوابة النجوم لإنقاذ مملكة الأحلام!</p><div class="row"><span class="stat">💎 '+gems+'</span><span class="stat">⭐ '+stars+'</span><span class="stat">🗺️ '+unlocked+'/15</span></div><div class="actions"><button class="btn green" onclick="F.start()">ابدأ المغامرة ▶</button><button class="btn" onclick="F.fishing()">🐟 بحيرة الصيد</button><button class="btn" onclick="F.map()">خريطة العوالم</button><button class="btn" onclick="F.learnMenu()">🎓 ألعاب تعليمية</button><button class="btn" onclick="F.shop()">متجر الأزياء</button><button class="btn dark" onclick="F.settings()">الإعدادات ⚙</button></div><p class="sub">تعمل دون إنترنت · تحكم باللمس · حفظ تلقائي</p>')}
function map(){mode='map';let s='<div class="logo">🗺️</div><h1>خريطة المغامرة</h1><p class="sub">15 مرحلة في ثلاثة عوالم</p>';worlds.forEach((w,i)=>{s+='<h3>'+['🌳','🏜️','☁️'][i]+' '+w[0]+'</h3><div class="levels">';for(let j=1;j<=5;j++){let n=i*5+j,done=records[n]!=null,open=n<=unlocked;s+='<button class="lv '+(done?'done':open?'open':'')+'" '+(open?'':'disabled')+' onclick="F.level('+n+')">'+(done?'★':open?'▶':'🔒')+'<br>'+n+'</button>'}s+='</div>'});s+='<div class="actions"><button class="btn dark" onclick="F.home()">الرئيسية</button></div>';show(s)}
function start(n){if(n>unlocked)return;make(n);audioOn();mode='play';$('bar').style.display='flex';$('pad').style.display='flex';if([1,6,11].includes(n)){mode='story';let tales={1:'وصلت فريدة إلى الغابة المضيئة. اختفت نجوم البوصلة، ولا بد من جمع البلورات وإعادة النور إلى شجرة الأمنيات!',6:'عبرت فريدة الصحراء الذهبية. حارس الرمال أغلق الطريق إلى الجزر، ساعدها في جمع البلورات وفتح البوابة القديمة!',11:'وصلت فريدة إلى جزر النجوم. بقيت آخر رحلة لاستعادة نجمة الأحلام وإعادة السلام إلى الممالك الثلاث.'};show('<div class="logo">📖✨</div><h1>حكاية العالم</h1><p class="story">'+tales[n]+'</p><div class="actions"><button class="btn green" onclick="F.continueStory()">هيا نبدأ المغامرة ▶</button></div>')}else hide();last=performance.now();cancelAnimationFrame(raf);if(mode==='play')raf=requestAnimationFrame(loop)}
function settings(){mode='settings';show('<div class="logo">⚙️</div><h1>الإعدادات</h1><div class="actions"><button class="btn '+(sound?'green':'dark')+'" onclick="F.sound()">'+(sound?'المؤثرات 🔊':'المؤثرات مغلقة')+'</button><button class="btn '+(music?'green':'dark')+'" onclick="F.music()">'+(music?'الموسيقى 🎵':'الموسيقى مغلقة')+'</button><button class="btn dark" onclick="F.home()">رجوع</button></div><p class="sub">يبدأ الصوت بعد أول لمسة.</p>')}
function shop(){mode='shop';let s='<div class="logo">👗</div><h1>متجر الأزياء</h1><p class="sub">افتح أزياء فريدة بالبلورات</p><div class="row">';clothes.forEach((o,i)=>{s+='<div class="stat"><div style="font-size:34px">'+o[1]+'</div>'+o[0]+'<p>'+(owned.includes(i)?'مملوك ✓':o[2]+' 💎')+'</p><button class="btn" onclick="F.buy('+i+')">'+(owned.includes(i)?(skin===i?'محدد':'ارتدِ'):'شراء')+'</button></div>'});s+='</div><div class="actions"><button class="btn dark" onclick="F.home()">رجوع</button></div>';show(s)}
function buy(i){if(!owned.includes(i)){if(gems<clothes[i][2])return;gems-=clothes[i][2];owned.push(i)}skin=i;persist();shop()}
function pause(){if(mode!=='play')return;mode='pause';$('bgm').pause();show('<div class="logo">⏸️</div><h1>استراحة قصيرة</h1><div class="actions"><button class="btn green" onclick="F.resume()">استمرار ▶</button><button class="btn" onclick="F.retry()">إعادة المرحلة</button><button class="btn dark" onclick="F.map()">الخريطة</button></div>')}
function resume(){mode='play';hide();audioOn();last=performance.now();raf=requestAnimationFrame(loop)}
function win(){mode='win';$('bgm').pause();let r=deaths===0?3:deaths<3?2:1;gems+=earned+r*5;stars+=r;records[level]=Math.max(records[level]||0,r);unlocked=Math.max(unlocked,Math.min(15,level+1));persist();fx('win');$('pad').style.display='none';show('<div class="logo">🏆✨</div><h1>أحسنت يا بطل!</h1><p class="sub">أنهيت المرحلة '+level+'</p><div class="row"><span class="stat">⭐ '+'★'.repeat(r)+'☆'.repeat(3-r)+'</span><span class="stat">💎 '+(earned+r*5)+'</span></div><p class="story">فريدة فخورة بيك! البوابة التالية أصبحت مفتوحة.</p><div class="actions"><button class="btn green" onclick="F.next()">المرحلة التالية ▶</button><button class="btn" onclick="F.map()">الخريطة</button><button class="btn dark" onclick="F.home()">الرئيسية</button></div>')}
function hurt(){if(p.inv>0)return;p.life--;deaths++;$('lives').textContent=p.life;fx('hurt');p.inv=1.5;if(p.life<=0){mode='failed';$('pad').style.display='none';show('<div class="logo">💫</div><h1>حاول مرة أخرى</h1><div class="actions"><button class="btn green" onclick="F.retry()">إعادة المرحلة</button><button class="btn dark" onclick="F.map()">الخريطة</button></div>')}else{p.x=checkpoint||55;p.y=300;p.vx=p.vy=0}}
function jump(){if(mode!=='play'||!p.ground)return;p.vy=-13.5;p.ground=false;fx('jump')}
function attack(){if(mode!=='play')return;p.attack=.25;fx('attack');foes.forEach(e=>{if(e.alive&&Math.abs(e.x-p.x)<100&&Math.abs(e.y-p.y)<75&&Math.sign(e.x-p.x)===p.face){e.alive=false;for(let i=0;i<8;i++)bits.push({x:e.x,y:e.y,vx:Math.random()*8-4,vy:-Math.random()*5,life:1})}})}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){let d=(keys.ArrowLeft||keys.KeyA||touch.l?-1:0)+(keys.ArrowRight||keys.KeyD||touch.r?1:0);p.vx=d*5.2;if(d)p.face=d;p.vy=Math.min(16,p.vy+.62*dt*60);p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.ground=false;plats.forEach(q=>{if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h-p.vy*dt*60<=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true}});p.x=Math.max(0,p.x);if(p.y>790)hurt();if(p.inv>0)p.inv-=dt;if(p.attack>0)p.attack-=dt;p.anim+=dt*10;coins.forEach(q=>{q.phase+=dt*3;if(!q.got&&Math.hypot(p.x+20-q.x,p.y+25-q.y)<43){q.got=true;earned++;gems++;$('gems').textContent=gems;$('score').textContent=earned;fx('coin');bits.push({x:q.x,y:q.y,vx:0,vy:-3,life:1})}});traps.forEach(q=>{if(hit(p,q))hurt()});foes.forEach(e=>{if(!e.alive)return;e.x+=e.v*dt*60;if(e.x<e.min||e.x>e.max)e.v*=-1;if(hit(p,{x:e.x,y:e.y,w:38,h:34})){if(p.vy>2&&p.y+p.h-e.y<25){e.alive=false;p.vy=-9}else hurt()}});bits.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.life-=dt*1.7});bits=bits.filter(q=>q.life>0);if(p.x>gate.x-20&&p.y+p.h>gate.y+25&&p.y<gate.y+gate.h)win();cam=Math.max(0,Math.min(p.x-390,plats[5].x+plats[5].w-W));if(p.x>checkpoint+220)checkpoint=p.x-70}
const artImages={forest:new Image(),desert:new Image(),star_islands:new Image()};artImages.forest.src='art/forest_background.jpg';artImages.desert.src='art/desert_background.jpg';artImages.star_islands.src='art/star_islands_background.jpg';const faridaStrip=new Image();faridaStrip.src='art/farida_character_strip.png';
function background(){let w=world(),g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,w[1]);g.addColorStop(1,w[2]);c.fillStyle=g;c.fillRect(0,0,W,H);let bg=artImages[['forest','desert','star_islands'][Math.floor((level-1)/5)]];if(bg.complete&&bg.naturalWidth)c.drawImage(bg,0,0,W,H);for(let i=0;i<9;i++){let x=i*190-(cam*.2%190);c.fillStyle=w[3];c.beginPath();c.moveTo(x,590);c.lineTo(x+95,250+i%3*35);c.lineTo(x+190,590);c.fill()}for(let i=0;i<12;i++){let x=i*145-(cam*.38%145);c.fillStyle=w[4];c.beginPath();c.moveTo(x,630);c.quadraticCurveTo(x+50,330+i%4*25,x+145,630);c.fill()}}
function platform(q){c.fillStyle=world()[4];c.beginPath();c.roundRect(q.x,q.y,q.w,q.h,9);c.fill();c.fillStyle='#b2ef91';c.beginPath();c.roundRect(q.x,q.y,q.w,9,7);c.fill()}
function crystal(x,y,t){c.save();c.translate(x,y+Math.sin(t)*6);c.rotate(Math.sin(t)*.15);c.shadowColor='#78fff2';c.shadowBlur=20;c.fillStyle='#79ffe4';c.beginPath();c.moveTo(0,-20);c.lineTo(15,-3);c.lineTo(8,17);c.lineTo(-9,17);c.lineTo(-16,-3);c.closePath();c.fill();c.restore()}

function draw(){background();c.save();c.translate(-cam,0);plats.forEach(platform);traps.forEach(q=>{c.fillStyle='#ed6b69';c.beginPath();for(let i=0;i<5;i++){c.lineTo(q.x+i*q.w/4,q.y+q.h);c.lineTo(q.x+(i+.5)*q.w/4,q.y)}c.fill()});coins.forEach(q=>{if(!q.got)crystal(q.x,q.y,q.phase)});foes.forEach(e=>{if(e.alive){c.fillStyle='#583d78';c.beginPath();c.ellipse(e.x+18,e.y+18,20,17,0,0,7);c.fill();c.fillStyle='#ffb3c9';c.beginPath();c.arc(e.x+11,e.y+14,4,0,7);c.arc(e.x+25,e.y+14,4,0,7);c.fill()}});c.fillStyle='#fff';c.fillRect(checkpoint,plats[0].y-55,5,55);c.save();c.shadowColor='#d8a8ff';c.shadowBlur=35;c.strokeStyle='#f0c5ff';c.lineWidth=9;c.beginPath();c.ellipse(gate.x+30,gate.y+52,29,49,0,0,7);c.stroke();c.restore();if(p.inv<=0||Math.floor(p.inv*12)%2===0)drawGirl(p.x,p.y,p.face,p.anim);if(p.attack>0){c.strokeStyle='#fff4a6';c.lineWidth=9;c.beginPath();c.arc(p.x+(p.face>0?48:-8),p.y+22,38,-1.1,1.1);c.stroke()}bits.forEach(q=>{c.globalAlpha=q.life;c.fillStyle='#9effe0';c.beginPath();c.arc(q.x,q.y,5,0,7);c.fill()});c.globalAlpha=1;c.restore();c.fillStyle='#071a3b88';c.fillRect(25,680,1230,9);c.fillStyle='#ffd66b';c.fillRect(25,680,1230*Math.max(0,Math.min(1,p.x/gate.x)),9)}

function learnMenu(){mode='learnmenu';show('<div class="logo">🎓🧩</div><h1>ألعاب فريدة التعليمية</h1><p class="story">العب وتعلّم واجمع البلورات!</p><div class="actions"><button class="btn green" onclick="F.playLearn(\'memory\')">🧠 لعبة الذاكرة</button><button class="btn" onclick="F.playLearn(\'colors\')">🎨 تعلّم الألوان</button><button class="btn" onclick="F.playLearn(\'letters\')">🔤 الحروف العربية</button><button class="btn" onclick="F.playLearn(\'animals\')">🐾 عالم الحيوانات</button><button class="btn" onclick="F.playLearn(\'shapes\')">🔷 الأشكال الهندسية</button><button class="btn dark" onclick="F.home()">الرئيسية</button></div>')}
function playLearn(type){audioOn();learnType=type;learnScore=0;learnQuestion=0;learnOpen=[];learnMatched=[];if(type==='memory'){learnCards=['🍎','🍎','🐟','🐟','⭐','⭐','🌸','🌸'].sort(()=>Math.random()-.5)}mode='learn';renderLearn()}
function renderLearn(){
 if(learnType==='memory'){let s='<div class="logo">🧠</div><h1>لعبة الذاكرة</h1><p class="sub">اكشف البطاقات واعثر على الأزواج · '+learnMatched.length/2+'/4</p><div class="levels" style="grid-template-columns:repeat(4,1fr)">';learnCards.forEach((v,i)=>{let open=learnOpen.includes(i)||learnMatched.includes(i);s+='<button class="lv '+(learnMatched.includes(i)?'done':'open')+'" style="font-size:clamp(24px,4vw,40px);min-height:70px" onclick="F.flipMemory('+i+')">'+(open?v:'❔')+'</button>'});s+='</div><div class="actions"><button class="btn dark" onclick="F.learnMenu()">رجوع</button></div>';show(s);return}
 if(learnType==='animals'||learnType==='shapes'){let bank=learnType==='animals'?animalsQuiz:shapesQuiz,q=bank[learnTarget%bank.length],choices=[q,...bank.filter((_,i)=>i!==learnTarget%bank.length).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);learnChoices=choices;let title=learnType==='animals'?'عالم الحيوانات':'الأشكال الهندسية';let s='<div class="logo">'+(learnType==='animals'?'🐾':'🔷')+'</div><h1>'+title+'</h1><p class="story">'+q[2]+'</p><p class="sub">إجابات صحيحة: '+learnScore+' من 6</p><div class="row">';choices.forEach((v,i)=>s+='<button class="btn" style="min-width:110px;min-height:100px;font-size:clamp(17px,2.4vw,25px)" onclick="F.pickKnowledge('+i+')"><span style="display:block;font-size:40px">'+v[0]+'</span>'+v[1]+'</button>');s+='</div><div class="actions"><button class="btn dark" onclick="F.learnMenu()">رجوع</button></div>';show(s);return}
 if(learnType==='animals'||learnType==='shapes'){let bank=learnType==='animals'?animalsQuiz:shapesQuiz,q=bank[learnTarget%bank.length],choices=[q,...bank.filter((_,i)=>i!==learnTarget%bank.length).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);learnChoices=choices;let title=learnType==='animals'?'عالم الحيوانات':'الأشكال الهندسية';let s='<div class="logo">'+(learnType==='animals'?'🐾':'🔷')+'</div><h1>'+title+'</h1><p class="story">'+q[2]+'</p><p class="sub">إجابات صحيحة: '+learnScore+' من 6</p><div class="row">';choices.forEach((v,i)=>s+='<button class="btn" style="min-width:110px;min-height:100px;font-size:clamp(17px,2.4vw,25px)" onclick="F.pickKnowledge('+i+')"><span style="display:block;font-size:40px">'+v[0]+'</span>'+v[1]+'</button>');s+='</div><div class="actions"><button class="btn dark" onclick="F.learnMenu()">رجوع</button></div>';show(s);return}
 if(learnType==='colors'){let target=colorsQuiz[learnTarget%colorsQuiz.length],choices=[target,...colorsQuiz.filter((_,i)=>i!==learnTarget%colorsQuiz.length).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);learnChoices=choices;let s='<div class="logo">🎨</div><h1>تعلّم الألوان</h1><p class="story">أين اللون <b>'+target[0]+'</b>؟</p><p class="sub">إجابات صحيحة: '+learnScore+'</p><div class="row">';choices.forEach((v,i)=>s+='<button class="btn" style="background:'+v[1]+';min-width:90px;min-height:75px;color:#17243a" onclick="F.pickColor('+i+')">'+v[0]+'</button>');s+='</div><div class="actions"><button class="btn dark" onclick="F.learnMenu()">رجوع</button></div>';show(s);return}
 let q=lettersQuiz[learnTarget%lettersQuiz.length],choices=[q[0],...lettersQuiz.filter((_,i)=>i!==learnTarget%lettersQuiz.length).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5);learnChoices=choices;let s='<div class="logo">🔤</div><h1>الحروف العربية</h1><p class="story">ما الحرف الأول في كلمة '+q[1]+'؟ '+q[2]+'</p><p class="sub">إجابات صحيحة: '+learnScore+'</p><div class="row">';choices.forEach((v,i)=>s+='<button class="btn" style="font-size:32px;min-width:75px" onclick="F.pickLetter('+i+')">'+v+'</button>');s+='</div><div class="actions"><button class="btn dark" onclick="F.learnMenu()">رجوع</button></div>';show(s)
}
function learnReward(){gems+=5;persist();mode='learnreward';show('<div class="logo">🏅🌟</div><h1>أحسنت يا بطل!</h1><p class="story">أنهيت اللعبة التعليمية وربحت 5 بلورات.</p><div class="actions"><button class="btn green" onclick="F.learnMenu()">ألعاب أخرى</button><button class="btn dark" onclick="F.home()">الرئيسية</button></div>')}
function flipMemory(i){if(mode!=='learn'||learnType!=='memory'||learnMatched.includes(i))return;if(learnOpen.length===2)learnOpen=[];if(learnOpen.includes(i))return;learnOpen.push(i);if(learnOpen.length===2&&learnCards[learnOpen[0]]===learnCards[learnOpen[1]]){learnMatched.push(...learnOpen);learnScore++;learnOpen=[];fx('coin')}renderLearn();if(learnMatched.length===8)learnReward()}
function pickColor(i){if(learnChoices[i][0]===colorsQuiz[learnTarget%colorsQuiz.length][0]){learnScore++;learnTarget++;fx('coin');if(learnScore>=6){learnReward();return}}else fx('hurt');renderLearn()}
function pickLetter(i){if(learnChoices[i]===lettersQuiz[learnTarget%lettersQuiz.length][0]){learnScore++;learnTarget++;fx('coin');if(learnScore>=6){learnReward();return}}else fx('hurt');renderLearn()}
function pickKnowledge(i){let bank=learnType==='animals'?animalsQuiz:shapesQuiz;if(learnChoices[i]===bank[learnTarget%bank.length]){learnScore++;learnTarget++;fx('coin');if(learnScore>=6){learnReward();return}}else fx('hurt');renderLearn()}
function pickKnowledge(i){let bank=learnType==='animals'?animalsQuiz:shapesQuiz;if(learnChoices[i]===bank[learnTarget%bank.length]){learnScore++;learnTarget++;fx('coin');if(learnScore>=6){learnReward();return}}else fx('hurt');renderLearn()}

function fishing(){
  audioOn(); mode='fishing'; $('bar').style.display='none'; $('pad').style.display='none'; hide();
  fishCaught=0; fishStart=performance.now();
  fishSchool=Array.from({length:9},(_,i)=>({x:90+Math.random()*1100,y:300+Math.random()*260,v:(Math.random()*2+1)*(Math.random()<.5?-1:1),s:22+Math.random()*20,hue:[25,48,185,300,165][i%5],wave:Math.random()*6}));
  cv.onpointerdown=fishTap; cancelAnimationFrame(raf); cancelAnimationFrame(fishRaf); fishLoop(performance.now());
}
function fishTap(e){
  if(mode!=='fishing')return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(let i=fishSchool.length-1;i>=0;i--){const f=fishSchool[i];if(Math.hypot(x-f.x,y-f.y)<f.s+22){fishSchool.splice(i,1);fishCaught++;gems+=2;$('gems').textContent=gems;fx('coin');if(fishCaught>=10){finishFishing();return}fishSchool.push({x:Math.random()*1100+80,y:300+Math.random()*250,v:(Math.random()*2+1)*(Math.random()<.5?-1:1),s:22+Math.random()*20,hue:Math.random()*360,wave:0});break}}
}
function fishLoop(now){
 if(mode!=='fishing')return;
 const elapsed=(now-fishStart)/1000;
 const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#83d9f4');g.addColorStop(.42,'#238bb8');g.addColorStop(1,'#073b72');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.fillStyle='#ffe59a';c.beginPath();c.arc(1080,100,55,0,7);c.fill();
 for(let i=0;i<24;i++){let bx=(i*67+now*.018)%W,by=(i*43+Math.sin(now*.001+i)*20)%H;c.strokeStyle='#ffffff55';c.beginPath();c.arc(bx,by,3+(i%4),0,7);c.stroke()}
 c.fillStyle='#155b70';c.beginPath();c.moveTo(0,620);for(let x=0;x<=W;x+=80)c.quadraticCurveTo(x+40,570+Math.sin(x*.02+now*.001)*24,x+80,620);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 fishSchool.forEach(f=>{f.x+=f.v;f.wave+=.05;if(f.x<40||f.x>W-40)f.v*=-1;c.save();c.translate(f.x,f.y+Math.sin(f.wave)*8);c.scale(f.v>0?1:-1,1);c.fillStyle='hsl('+f.hue+' 75% 58%)';c.beginPath();c.ellipse(0,0,f.s*1.35,f.s*.75,0,0,7);c.fill();c.beginPath();c.moveTo(-f.s,0);c.lineTo(-f.s*1.8,-f.s*.8);c.lineTo(-f.s*1.8,f.s*.8);c.closePath();c.fill();c.fillStyle='white';c.beginPath();c.arc(f.s*.7,-5,6,0,7);c.fill();c.fillStyle='#17304a';c.beginPath();c.arc(f.s*.75,-5,3,0,7);c.fill();c.restore()});
 c.fillStyle='#fff';c.textAlign='center';c.font='bold 38px system-ui';c.fillText('🐟 بحيرة الصيد',W/2,75);c.font='bold 27px system-ui';c.fillText('اصطد 10 سمكات باللمس  ·  '+fishCaught+'/10',W/2,125);c.font='bold 22px system-ui';c.fillText('الوقت: '+Math.max(0,60-Math.floor(elapsed))+' ثانية',W/2,165);
 if(elapsed>=60){finishFishing();return}fishRaf=requestAnimationFrame(fishLoop);
}
function finishFishing(){
 if(mode!=='fishing')return;mode='fishdone';cancelAnimationFrame(fishRaf);cv.onpointerdown=null;persist();show('<div class="logo">🎣🐠</div><h1>رحلة صيد رائعة!</h1><p class="story">اصطدت '+fishCaught+' سمكات وربحت '+(fishCaught*2)+' بلورة.</p><div class="actions"><button class="btn green" onclick="F.fishing()">العب مرة أخرى</button><button class="btn dark" onclick="F.home()">الرئيسية</button></div>');
}
